name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'build.gradle', 'gradle.properties', 'settings.gradle', '.github/workflows/build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build
        id: build
        run: |
          set +e
          gradle build --no-daemon --console=plain > /tmp/build.log 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Log veroeffentlichen
        if: always()
        run: |
          mkdir -p /tmp/lg && tail -300 /tmp/build.log > /tmp/lg/build.log
          echo "exit=${{ steps.build.outputs.code }}" > /tmp/lg/status.txt
          cd /tmp/lg
          git init -q -b logs && git config user.name actions && git config user.email actions@users.noreply.github.com
          git add . && git commit -qm "build log"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs
      - name: Release
        if: steps.build.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          cp "$JAR" stormix-client.jar
          gh release delete latest -y --cleanup-tag || true
          gh release create latest stormix-client.jar --title "Stormix Client (neueste Version)" --notes "Wird automatisch gebaut."
      - name: Fehlschlag melden
        if: steps.build.outputs.code != '0'
        run: exit 1
