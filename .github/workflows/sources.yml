name: sources
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sources.yml']
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: genSources
        run: gradle genSources --no-daemon > /tmp/gen.log 2>&1 || true
      - name: Collect
        if: always()
        run: |
          mkdir -p /tmp/lg
          tail -120 /tmp/gen.log > /tmp/lg/gen.log
          find / -name '*sources*.jar' -size +100k 2>/dev/null | grep -E 'minecraft|fabric-(rendering|key-binding|lifecycle|screen|api-base|client)' | grep -v '/proc/' > /tmp/lg/jars.txt || true
          i=0; while read -r f; do i=$((i+1)); cp "$f" "/tmp/lg/$(basename "$f")"; done < /tmp/lg/jars.txt
          ls -la /tmp/lg > /tmp/lg/ls.txt
          cd /tmp/lg
          git init -q -b logs && git config user.name actions && git config user.email actions@users.noreply.github.com
          git add . && git commit -qm sources
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs
