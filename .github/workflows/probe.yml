name: probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          {
          echo "== java"; java -version 2>&1 | head -1
          echo "== game versions"; curl -s https://meta.fabricmc.net/v2/versions/game | python3 -c "import sys,json;print([v['version'] for v in json.load(sys.stdin)][:15])"
          echo "== loader"; curl -s https://meta.fabricmc.net/v2/versions/loader | python3 -c "import sys,json;print([v['version'] for v in json.load(sys.stdin)][:4])"
          echo "== loom"; curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -oP '(?<=<version>)[^<]+' | tail -6
          echo "== fabric-api 26"; curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -oP '(?<=<version>)[^<]+' | grep -E '\+26' | tail -12
          echo "== example mod branches"; git ls-remote --heads https://github.com/FabricMC/fabric-example-mod | awk '{print $2}'
          for b in $(git ls-remote --heads https://github.com/FabricMC/fabric-example-mod | awk '{print $2}' | sed 's#refs/heads/##' | grep -E '^(26|1\.21)' | sort -V | tail -1) ; do
            echo "== example branch $b"
            git clone -q --depth 1 -b "$b" https://github.com/FabricMC/fabric-example-mod /tmp/ex
            echo "--- gradle.properties"; cat /tmp/ex/gradle.properties
            echo "--- build.gradle"; cat /tmp/ex/build.gradle
            echo "--- wrapper"; cat /tmp/ex/gradle/wrapper/gradle-wrapper.properties
            echo "--- fabric.mod.json"; cat /tmp/ex/src/main/resources/fabric.mod.json
            echo "--- tree"; (cd /tmp/ex && find src -type f)
          done
          } > /tmp/probe.txt 2>&1
          mkdir /tmp/lg && cp /tmp/probe.txt /tmp/lg/probe.txt && cd /tmp/lg
          git init -q -b logs && git config user.name actions && git config user.email actions@users.noreply.github.com
          git add . && git commit -qm probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs
